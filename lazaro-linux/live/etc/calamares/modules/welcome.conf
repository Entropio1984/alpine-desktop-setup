---
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
    # GNOME y Plasma piden más; XFCE cabe holgado en 10 GB.
    requiredStorage: 10
    requiredRam: 1.0
    internetCheckUrl: http://dl-cdn.alpinelinux.org/alpine/
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    # Internet no es obligatorio: XFCE se instala desde la ISO.
    required:
        - storage
        - ram
        - root

geoip:
    style: "none"
