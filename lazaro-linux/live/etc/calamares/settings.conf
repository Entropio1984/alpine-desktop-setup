# Calamares de Lázaro Linux. Orden de las pantallas (show) y de los
# trabajos de instalación (exec). Los pasos propios de Alpine viven en
# /usr/sbin/lazaro-instalar y se llaman desde los shellprocess.
---
modules-search: [ local ]

instances:
- id: escritorio
  module: packagechooser
  config: packagechooser-escritorio.conf
- id: base
  module: shellprocess
  config: shellprocess-base.conf
  weight: 40
- id: escritorio
  module: shellprocess
  config: shellprocess-escritorio.conf
  weight: 30
- id: ajustes
  module: shellprocess
  config: shellprocess-ajustes.conf
  weight: 30

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - packagechooser@escritorio
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - shellprocess@base
  - users
  - shellprocess@escritorio
  - shellprocess@ajustes
  - umount
- show:
  - finished

branding: lazaro
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
