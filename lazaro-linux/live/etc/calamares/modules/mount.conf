---
# lazaro-instalar y setup-disk montan /proc, /sys y /dev cuando los
# necesitan; aquí solo se monta lo que piden los módulos de Calamares.
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
