---
# Grupos de Alpine para un usuario de escritorio. "wheel" da acceso a
# doas (lo configura lazaro-instalar ajustes).
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true
    - audio
    - video
    - netdev
    - input
    - lp
    - name: plugdev
      must_exist: false
      system: true

doAutologin: false
displayAutologin: false
setRootPassword: true
doReusePassword: true

passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false

user:
    shell: /bin/ash
    forbidden_names: [ root, lazaro ]

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "lazaro-${cpu}"
    forbidden_names: [ localhost ]

presets:
    fullName:
        editable: true
    loginName:
        editable: true
