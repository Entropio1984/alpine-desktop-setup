# Elección del escritorio. Son los que acepta "setup-desktop" de Alpine
# (alpine-conf 3.22.0, Alpine 3.24): xfce xfce-wayland gnome plasma mate
# sway lxqt. El valor elegido queda en Global Storage como
# packagechooser_escritorio y lo usan los shellprocess.
---
mode: required
method: legacy
labels:
    step: "Desktop"
    step[es]: "Escritorio"
default: xfce
items:
    - id: xfce
      name: "XFCE (recommended)"
      name[es]: "XFCE (recomendado)"
      description: "Light and classic. Installs without internet."
      description[es]: "Ligero y clásico, ideal para equipos antiguos. Se instala sin internet desde el USB."
      screenshot: "escritorio-xfce.png"
    - id: mate
      name: "MATE"
      description: "Light, traditional desktop. Needs internet."
      description[es]: "Ligero y tradicional, parecido a los escritorios de antes. Necesita internet."
      screenshot: "escritorio-mate.png"
    - id: lxqt
      name: "LXQt"
      description: "The lightest option. Needs internet."
      description[es]: "El más liviano, para equipos con muy poca memoria. Necesita internet."
      screenshot: "escritorio-lxqt.png"
    - id: xfce-wayland
      name: "XFCE (Wayland, experimental)"
      description: "XFCE on Wayland with labwc. Needs internet."
      description[es]: "XFCE sobre Wayland con labwc. Experimental. Necesita internet."
      screenshot: "escritorio-xfce.png"
    - id: gnome
      name: "GNOME"
      description: "Modern desktop. Heavy for old hardware. Needs internet."
      description[es]: "Moderno y completo, pero pesado para equipos antiguos (4 GB de RAM o más). Necesita internet."
      screenshot: "escritorio-gnome.png"
    - id: plasma
      name: "KDE Plasma"
      description: "Full-featured desktop. Heavy for old hardware. Needs internet."
      description[es]: "Muy completo y configurable, pero pesado para equipos antiguos (4 GB de RAM o más). Necesita internet."
      screenshot: "escritorio-plasma.png"
    - id: sway
      name: "Sway"
      description: "Tiling window manager for advanced users. Needs internet."
      description[es]: "Gestor de ventanas en mosaico, para usuarios avanzados (se maneja con el teclado). Necesita internet."
      screenshot: "escritorio-sway.png"
